<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Figment</title>
    <style>
      /* Standard scrollbar for Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #3f3f46 #18181b;
      }
      
      /* Webkit scrollbar for Chrome/Edge/Safari */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
      
      html, body, #root {
          height: 100%;
          width: 100%;
          margin: 0;
          padding: 0;
          background-color: #09090b; /* zinc-950 match */
          overscroll-behavior: none; /* Prevents bounce on mobile */
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
