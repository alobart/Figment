    <style>
      /* Standard scrollbar for Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #3f3f46 #18181b;
      }
      
      /* Webkit scrollbar for Chrome/Edge/Safari */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
      
      html, body, #root {
          height: 100%;
          width: 100%;
          margin: 0;
          padding: 0;
          background-color: #09090b; /* zinc-950 match */
          overscroll-behavior: none; /* Prevents bounce on mobile */
      }
    </style>
